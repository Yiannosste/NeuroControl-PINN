<rect x="542.18" y="374.5" width="155.64000000000001" height="21.5" rx="4" fill="white" fill-opacity="0.92"/>
<text x="620" y="387" text-anchor="middle" font-size="13.5" font-weight="500" fill="#111827" font-style="italic">u<tspan baseline-shift="sub" font-size="72%">0</tspan><tspan baseline-shift="super" font-size="72%">*</tspan> (first control)</text>
<path d="M 700,455 L 542,455" fill="none" stroke="#111827" stroke-width="2.2" marker-end="url(#arrow)" stroke-linejoin="round"/>
