<text x="620" y="479" text-anchor="middle" font-size="13.5" font-weight="500" fill="#111827" font-style="italic">measured state x<tspan baseline-shift="sub" font-size="72%">k</tspan></text>
<rect x="40" y="570" width="1120" height="70" rx="10" fill="#FEF9E7" stroke="#A16207" stroke-width="2"/>
<text x="600.0" y="598" text-anchor="middle" font-weight="700" font-size="15.5" fill="#111827">Benchmark on identical closed-loop runs (same x<tspan baseline-shift="sub" font-size="72%">0</tspan>, reference, noise seed, Q, R, P, horizon)</text>
<text x="600.0" y="626" text-anchor="middle" font-size="13.5" font-weight="400" fill="#4B5563">PINN-MPC  vs  Classical MPC (oracle, true equations)  vs  PID  ·  metrics: RMSE, settling time, ISE<tspan baseline-shift="sub" font-size="72%">u</tspan>, solve time</text>
